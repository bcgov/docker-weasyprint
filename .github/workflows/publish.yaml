name: Publish WeasyPrint Container Images
run-name: Publish WeasyPrint Container ${{ inputs.tag || github.event.release.tag_name || github.sha }} Images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (for example, v1.2.3 or feature-abc-1234).'
        required: true
        type: string
      ref:
        description: 'Optional - The branch, tag or SHA to checkout.'
        required: false
        type: string
      platforms:
        description: 'Platforms - Comma separated list of the platforms to support.'
        required: true
        default: linux/amd64
        type: string

  workflow_call:
    inputs:
      tag:
        description: 'Optional image tag to publish.'
        required: false
        type: string
      ref:
        required: false
        type: string
      platforms:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-image:
    # Ensure this only runs on the main repository so we're not publishing images to other repositories.
    if: ${{ github.event.repository.full_name == 'bcgov/docker-weasyprint' }}

    strategy:
      fail-fast: false
      matrix:
        imageName: [weasyprint]
        include:
          - imageName: weasyprint
            dockerFile: Dockerfile

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase repo owner
        id: lowercase_repo_owner
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ github.repository_owner }}

      - name: Build and publish the image
        uses: ./.github/actions/publish-image
        with:
          ref: ${{ inputs.ref || '' }}
          tag: ${{ inputs.tag || '' }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          dockerfile: ${{ matrix.dockerFile }}
          context: .
          image_name: ${{ steps.lowercase_repo_owner.outputs.lowercase }}/${{ matrix.imageName }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
